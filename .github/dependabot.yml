---
version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: weekly
    day: tuesday
    time: '10:00'
    timezone: America/New_York
  open-pull-requests-limit: 2
  labels:
  - dependencies
  - python
  commit-message:
    prefix: deps
    include: scope
  groups:
    python-minor-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
    day: tuesday
    time: '10:00'
    timezone: America/New_York
  open-pull-requests-limit: 1
  labels:
  - dependencies
  - docker
  commit-message:
    prefix: deps
    include: scope
  ignore:
  # A base-image version jump is a coordinated change, not a dependency bump:
  # the Dockerfile FROM tag and requirements.lock (--python-version) have to
  # move together. Dependabot moves only the first, and it reads as noise in
  # review, which is how Python 3.14 shipped against 3.13 lockfiles elsewhere
  # in this fleet. Digest refreshes and patch bumps still flow, so security
  # rebuilds are kept.
  - dependency-name: python
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: tuesday
    time: '10:00'
    timezone: America/New_York
  open-pull-requests-limit: 1
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: ci
    include: scope
  groups:
    actions-minor-patch:
      update-types:
      - minor
      - patch
