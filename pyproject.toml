[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "mcp-threatintel"
version = "0.3.0"
description = "MCP server for threat intelligence: IOC lookups, full-text threat search, CISA KEV CVE checks, AlienVault OTX pulses, HIBP/LeakCheck breach lookups, and Ahmia dark-web search over a local SQLite cache."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pete Stergion", email = "pstergion@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "threat-intelligence", "ioc", "cve", "otx", "cisa-kev", "claude", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=3.4.0",
    "httpx>=0.28.1",
    "uvicorn>=0.49.0",
    "python-dotenv>=1.1.0",
    # Pinned to an immutable commit tarball until pete-mcp-core is on PyPI.
    # Revert to "pete-mcp-core>=0.1.0" once it publishes.
    "pete-mcp-core @ https://github.com/pete-builds/pete-mcp-core/archive/60cc81ece57358b775bcf0f01d356a6ea2995790.tar.gz",
]

[project.optional-dependencies]
dev = [
    "build>=1.5.0",
    "twine>=6.2.0",
    "ruff>=0.15.17,<0.17",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
mcp-threatintel = "mcp_threatintel.server:main"
mcp-threatintel-poller = "mcp_threatintel.poller:main"

[project.urls]
Homepage = "https://github.com/pete-builds/mcp-threatintel"
Repository = "https://github.com/pete-builds/mcp-threatintel"
Issues = "https://github.com/pete-builds/mcp-threatintel/issues"

[tool.hatch.metadata]
# Required for the pete-mcp-core commit-tarball pin above. Can be dropped
# once that dependency reverts to a plain PyPI version specifier.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_threatintel"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/.env.example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# PIN THE RULE SET, NOT JUST THE VERSION.
# With no select here, the enabled rules are whatever ruff ships as its defaults,
# so a version bump silently changes what CI enforces. Raising the ceiling to
# 0.16 turned 29 previously-passing findings into errors with no code change.
# These are ruff's 0.15-era defaults stated explicitly, so the lint surface is
# now a property of this repo rather than of whichever ruff resolves. Adding
# rules is a deliberate edit here, never a side effect of a bump.
select = ["E4", "E7", "E9", "F"]
