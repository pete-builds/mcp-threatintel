services:
  mcp-threatintel:
    build: .
    container_name: mcp-threatintel
    restart: unless-stopped
    ports:
      - "${FASTMCP_PORT:-3707}:3707"
    env_file:
      - .env
    environment:
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=3707
      - TZ=${TZ:-America/New_York}
    volumes:
      - threatintel-data:/data
    networks:
      - threatintel-net

  threatintel-poller:
    build: .
    container_name: threatintel-poller
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - threatintel-data:/data
    networks:
      - threatintel-net
    entrypoint: ["python", "-u", "poller.py", "--loop", "--interval", "3600"]

volumes:
  threatintel-data:

networks:
  threatintel-net:
