services:
  mcp-threatintel:
    # Pull the published image by default. To build locally instead, comment
    # out `image:` and uncomment `build: .`. The poller below shares this image.
    image: ghcr.io/pete-builds/mcp-threatintel:0.3.0
    # build: .
    container_name: mcp-threatintel
    restart: unless-stopped
    ports:
      - "${FASTMCP_PORT:-3707}:3707"
    # .env must define MCP_AUTH_TOKEN. The server refuses to serve HTTP without
    # a bearer token: with it missing or blank this container exits at startup
    # and, under the restart policy above, keeps restarting until it is set.
    # The token lives in .env on the host (chmod 600), never in this file and
    # never in git. See "Authentication" in the README.
    env_file:
      - .env
    environment:
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=3707
      - TZ=${TZ:-America/New_York}
    volumes:
      - threatintel-data:/data
    networks:
      - threatintel-net

  threatintel-poller:
    # Shares the same published image as mcp-threatintel above (built once from
    # this repo). To build locally instead, comment out `image:` / uncomment `build: .`.
    image: ghcr.io/pete-builds/mcp-threatintel:0.3.0
    # build: .
    container_name: threatintel-poller
    restart: unless-stopped
    # The poller needs no bearer token. It serves nothing and never reads
    # MCP_AUTH_TOKEN: it shares .env only for the feed API keys and DB_PATH.
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - threatintel-data:/data
    networks:
      - threatintel-net
    entrypoint: ["mcp-threatintel-poller", "--loop", "--interval", "3600"]

volumes:
  threatintel-data:

networks:
  threatintel-net:
