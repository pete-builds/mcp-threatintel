services:
  mcp-threatintel:
    # Pull the published image by default. To build locally instead, comment
    # out `image:` and uncomment `build: .`. The poller below shares this image.
    image: ghcr.io/pete-builds/mcp-threatintel:0.2.0
    # build: .
    container_name: mcp-threatintel
    restart: unless-stopped
    ports:
      - "${FASTMCP_PORT:-3707}:3707"
    env_file:
      - .env
    environment:
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=3707
      - TZ=${TZ:-America/New_York}
    volumes:
      - threatintel-data:/data
    networks:
      - threatintel-net

  threatintel-poller:
    # Shares the same published image as mcp-threatintel above (built once from
    # this repo). To build locally instead, comment out `image:` / uncomment `build: .`.
    image: ghcr.io/pete-builds/mcp-threatintel:0.2.0
    # build: .
    container_name: threatintel-poller
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - threatintel-data:/data
    networks:
      - threatintel-net
    entrypoint: ["mcp-threatintel-poller", "--loop", "--interval", "3600"]

volumes:
  threatintel-data:

networks:
  threatintel-net:
